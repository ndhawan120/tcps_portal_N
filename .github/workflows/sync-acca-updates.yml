name: Sync ACCA Updates

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ACCA announcements
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "User-Agent: TCPS-ACCA-Updates/1.0" \
            "https://xgmyasdoulblikhxaehg.supabase.co/functions/v1/sync-acca-updates"
